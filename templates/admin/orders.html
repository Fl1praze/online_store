{% extends "admin/base.html" %}

{% block title %}Админка – заказы{% endblock %}

{% block head %}
<script>
async function loadOrders() {
    const statusBox = document.getElementById("orders-status");
    const tbody = document.getElementById("orders-body");
    statusBox.textContent = "Загружаю...";
    tbody.innerHTML = "";
    try {
        const res = await fetch("/orders/get_all_orders");
        if (!res.ok) {
            throw new Error("Ошибка загрузки: " + res.status);
        }
        const orders = await res.json();
        if (!orders.length) {
            statusBox.textContent = "Заказов нет";
            return;
        }
        for (const o of orders) {
            const tr = document.createElement("tr");
            const items = o.items || [];
            const itemsText = items.map(i => `${i.product_id} x${i.quantity}`).join(", ");
            tr.innerHTML = `
                <td>${o.id}</td>
                <td>${o.user_id}</td>
                <td>${o.total_amount}</td>
                <td>${o.status}</td>
                <td>${o.shipping_address || ""}</td>
                <td>${o.payment_method || ""}</td>
                <td>${itemsText}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="cancelOrder(${o.id})">
                        Отменить
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        }
        statusBox.textContent = "";
    } catch (e) {
        statusBox.textContent = e.message;
    }
}

async function cancelOrder(id) {
    if (!confirm("Отменить заказ #" + id + "?")) return;
    const statusBox = document.getElementById("orders-status");
    try {
        const res = await fetch(`/orders/${id}/cancel`, { method: "PATCH" });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || ("Ошибка отмены: " + res.status));
        }
        statusBox.textContent = "Заказ отменён";
        await loadOrders();
    } catch (e) {
        statusBox.textContent = e.message;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    loadOrders();
});
</script>
{% endblock %}

{% block content %}
<h1>Заказы</h1>

<div class="card">
    <div id="orders-status" class="text-sm text-muted"></div>
    <table class="mt-2">
        <thead>
        <tr>
            <th>ID</th>
            <th>Пользователь</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Адрес</th>
            <th>Оплата</th>
            <th>Товары</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="orders-body"></tbody>
    </table>
</div>
{% endblock %}
