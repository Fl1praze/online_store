{% extends "admin/base.html" %}

{% block title %}Админка – отзывы{% endblock %}

{% block head %}
<script>
async function loadReviews() {
    const statusBox = document.getElementById("reviews-status");
    const tbody = document.getElementById("reviews-body");
    statusBox.textContent = "Введите ID товара или название товара и нажмите \"Загрузить\"";
    tbody.innerHTML = "";
}

function displayReviews(reviews) {
    const statusBox = document.getElementById("reviews-status");
    const tbody = document.getElementById("reviews-body");
    
    if (!reviews.length) {
        statusBox.textContent = "Отзывов нет";
        return;
    }
    
    tbody.innerHTML = "";
    for (const r of reviews) {
        const tr = document.createElement("tr");
        const productInfo = r.product_name ? `${r.product_name} (ID: ${r.product_id})` : `Товар #${r.product_id}`;
        tr.innerHTML = `
            <td>${r.id}</td>
            <td>${r.user_id}</td>
            <td>${productInfo}</td>
            <td>${r.rating}</td>
            <td>${r.comment || ""}</td>
            <td>${r.created_at || ""}</td>
            <td>
                <button class="btn btn-danger btn-sm" onclick="deleteReview(${r.id}, ${r.product_id})">
                    Удалить
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    }
    statusBox.textContent = `Найдено отзывов: ${reviews.length}`;
}

async function fetchReviewsForProduct() {
    const productId = document.getElementById("reviews-product-id").value;
    const productName = document.getElementById("reviews-product-name").value.trim();
    const statusBox = document.getElementById("reviews-status");
    const tbody = document.getElementById("reviews-body");
    
    if (!productId && !productName) {
        statusBox.textContent = "Укажите ID товара или название товара";
        return;
    }
    
    statusBox.textContent = "Загружаю...";
    tbody.innerHTML = "";
    
    try {
        let res;
        if (productName) {
            // Поиск по названию товара
            res = await fetch(`/reviews/search?product_name=${encodeURIComponent(productName)}`);
        } else {
            // Поиск по ID товара
            res = await fetch(`/reviews/product/${productId}`);
        }
        
        if (!res.ok) {
            const errorData = await res.json().catch(() => ({}));
            throw new Error(errorData.detail || ("Ошибка загрузки: " + res.status));
        }
        
        const reviews = await res.json();
        displayReviews(reviews);
    } catch (e) {
        statusBox.textContent = e.message;
    }
}

async function deleteReview(id, productId) {
    if (!confirm("Удалить отзыв #" + id + "?")) return;
    const statusBox = document.getElementById("reviews-status");
    try {
        const res = await fetch(`/reviews/${id}`, { method: "DELETE" });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || ("Ошибка удаления: " + res.status));
        }
        statusBox.textContent = "Отзыв удалён";
        document.getElementById("reviews-product-id").value = productId;
        await fetchReviewsForProduct();
    } catch (e) {
        statusBox.textContent = e.message;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    loadReviews();
});
</script>
{% endblock %}

{% block content %}
<h1>Отзывы</h1>

<div class="card">
    <div class="flex gap-3 flex-wrap">
        <div class="field" style="max-width: 200px;">
            <label>ID товара</label>
            <input type="number" id="reviews-product-id" placeholder="Введите ID"
                   onkeypress="if(event.key==='Enter'){ event.preventDefault(); fetchReviewsForProduct(); }">
        </div>
        <div class="field" style="max-width: 300px; flex: 1;">
            <label>Название товара</label>
            <input type="text" id="reviews-product-name" placeholder="Введите название товара"
                   onkeypress="if(event.key==='Enter'){ event.preventDefault(); fetchReviewsForProduct(); }">
        </div>
        <button class="btn btn-primary mt-3" onclick="fetchReviewsForProduct()">Загрузить</button>
    </div>
    <div id="reviews-status" class="text-sm text-muted mt-2"></div>
    <table class="mt-2">
        <thead>
        <tr>
            <th>ID</th>
            <th>Пользователь</th>
            <th>Товар</th>
            <th>Оценка</th>
            <th>Комментарий</th>
            <th>Создан</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="reviews-body"></tbody>
    </table>
</div>
{% endblock %}
