{% extends "admin/base.html" %}

{% block title %}Админка – пользователи{% endblock %}

{% block head %}
<script>
async function loadUsers() {
    const statusBox = document.getElementById("users-status");
    const tbody = document.getElementById("users-body");
    statusBox.textContent = "Загружаю...";
    tbody.innerHTML = "";
    try {
        const res = await fetch("/auth/admin/users", { credentials: "include" });
        if (!res.ok) {
            throw new Error("Ошибка загрузки: " + res.status);
        }
        const users = await res.json();
        if (!users.length) {
            statusBox.textContent = "Пользователей нет";
            return;
        }
        for (const u of users) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${u.id}</td>
                <td>${u.email || ""}</td>
                <td>${u.username || ""}</td>
                <td>${u.first_name || ""}</td>
                <td>${u.last_name || ""}</td>
                <td>${u.is_active ? "✓" : "✗"}</td>
                <td>${u.is_admin ? "✓" : "✗"}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="editUser(${u.id})">
                        Редактировать
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        }
        statusBox.textContent = "";
    } catch (e) {
        statusBox.textContent = e.message;
    }
}

let currentEditUserId = null;

async function editUser(userId) {
    currentEditUserId = userId;
    try {
        const res = await fetch("/auth/admin/users", { credentials: "include" });
        if (!res.ok) {
            throw new Error("Ошибка загрузки пользователя");
        }
        const users = await res.json();
        const user = users.find(u => u.id === userId);
        if (!user) {
            alert("Пользователь не найден");
            return;
        }
        
        document.getElementById("edit-email").value = user.email || "";
        document.getElementById("edit-username").value = user.username || "";
        document.getElementById("edit-first-name").value = user.first_name || "";
        document.getElementById("edit-last-name").value = user.last_name || "";
        document.getElementById("edit-is-active").checked = user.is_active || false;
        document.getElementById("edit-is-admin").checked = user.is_admin || false;
        
        document.getElementById("edit-modal").style.display = "block";
    } catch (e) {
        alert("Ошибка: " + e.message);
    }
}

function closeEditModal() {
    document.getElementById("edit-modal").style.display = "none";
    currentEditUserId = null;
}

async function saveUser() {
    if (!currentEditUserId) return;
    
    const statusBox = document.getElementById("users-status");
    const body = {
        email: document.getElementById("edit-email").value || null,
        username: document.getElementById("edit-username").value || null,
        first_name: document.getElementById("edit-first-name").value || null,
        last_name: document.getElementById("edit-last-name").value || null,
        is_active: document.getElementById("edit-is-active").checked,
        is_admin: document.getElementById("edit-is-admin").checked,
    };
    
    try {
        const res = await fetch(`/auth/admin/users/${currentEditUserId}`, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body),
            credentials: "include"
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || ("Ошибка обновления: " + res.status));
        }
        statusBox.textContent = "Пользователь обновлён";
        closeEditModal();
        await loadUsers();
    } catch (e) {
        statusBox.textContent = e.message;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    loadUsers();
});
</script>
{% endblock %}

{% block content %}
<h1>Пользователи</h1>

<div class="card">
    <div id="users-status" class="text-sm text-muted"></div>
    <table class="mt-2">
        <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Username</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Активен</th>
            <th>Админ</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="users-body"></tbody>
    </table>
</div>

<!-- Модальное окно редактирования -->
<div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 24px; border-radius: 8px; max-width: 500px; width: 90%;">
        <h2 style="margin-top: 0;">Редактировать пользователя</h2>
        <div class="field">
            <label>Email</label>
            <input type="email" id="edit-email" class="field input">
        </div>
        <div class="field">
            <label>Username</label>
            <input type="text" id="edit-username" class="field input">
        </div>
        <div class="field">
            <label>Имя</label>
            <input type="text" id="edit-first-name" class="field input">
        </div>
        <div class="field">
            <label>Фамилия</label>
            <input type="text" id="edit-last-name" class="field input">
        </div>
        <div class="field">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="edit-is-active">
                Активен
            </label>
        </div>
        <div class="field">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="edit-is-admin">
                Администратор
            </label>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
            <button class="btn btn-primary" onclick="saveUser()">Сохранить</button>
            <button class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
        </div>
    </div>
</div>
{% endblock %}
