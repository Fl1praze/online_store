{% extends "shop/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-lg shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Вход</h1>
        <div id="login-status" class="mb-4 text-sm text-center"></div>
        <form onsubmit="event.preventDefault(); login();" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="login-email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" id="login-password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" 
                    class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition-colors">
                Войти
            </button>
        </form>
        <p class="mt-6 text-sm text-center text-gray-600">
            Нет аккаунта? <a href="/auth/register" class="text-blue-600 hover:underline">Регистрация</a>
        </p>
    </div>
</div>

<script>
async function login() {
    const statusBox = document.getElementById("login-status");
    statusBox.textContent = "Выполняю вход...";
    statusBox.className = "mb-4 text-sm text-center text-gray-600";
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    try {
        const res = await fetch("/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email: email, password: password})
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            statusBox.textContent = data.detail || "Ошибка входа";
            statusBox.className = "mb-4 text-sm text-center text-red-600";
            return;
        }
        statusBox.textContent = "Успешный вход";
        statusBox.className = "mb-4 text-sm text-center text-green-600";
        setTimeout(() => {
            window.location.href = "/";
        }, 500);
    } catch (e) {
        statusBox.textContent = "Ошибка: " + e.message;
        statusBox.className = "mb-4 text-sm text-center text-red-600";
    }
}
</script>
{% endblock %}
