{% extends "shop/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-lg shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Регистрация</h1>
        <div id="reg-status" class="mb-4 text-sm text-center"></div>
        <form onsubmit="event.preventDefault(); registerUser();" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
                <input type="text" id="reg-first-name" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Фамилия</label>
                <input type="text" id="reg-last-name" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="reg-username" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="reg-email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" id="reg-password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" 
                    class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition-colors">
                Зарегистрироваться
            </button>
        </form>
        <p class="mt-6 text-sm text-center text-gray-600">
            Уже есть аккаунт? <a href="/auth/login" class="text-blue-600 hover:underline">Войти</a>
        </p>
    </div>
</div>

<script>
async function registerUser() {
    const statusBox = document.getElementById("reg-status");
    statusBox.textContent = "Регистрирую...";
    statusBox.className = "mb-4 text-sm text-center text-gray-600";
    const body = {
        first_name: document.getElementById("reg-first-name").value,
        last_name: document.getElementById("reg-last-name").value,
        username: document.getElementById("reg-username").value,
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value,
    };
    try {
        const res = await fetch("/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });
        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            statusBox.textContent = data.detail || "Ошибка регистрации";
            statusBox.className = "mb-4 text-sm text-center text-red-600";
            return;
        }
        statusBox.textContent = "Регистрация успешна. Подтвердите email и войдите.";
        statusBox.className = "mb-4 text-sm text-center text-green-600";
    } catch (e) {
        statusBox.textContent = "Ошибка: " + e.message;
        statusBox.className = "mb-4 text-sm text-center text-red-600";
    }
}
</script>
{% endblock %}
